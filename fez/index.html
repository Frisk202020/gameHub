<!DOCTYPE html>
<html>
    <head>
        <title>FEZ decipher</title>
        <link rel="icon" href="assets/icon.png" type="imege/png"> 
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <div id="main" style="width: 100vw; display: flex; flex-direction: column; align-items: center;">
            <h1>FEZ decipher</h1>
            <p id="input" style="
                font-size: 20px; 
                background-color: #f4f4f470; 
                border-radius: 5px; 
                padding: 10px;
                width: 80vw;
                text-align: center;
                word-wrap: break-word;
            ">
                Input some text.
            </p>
            <div id="output" style="
                display: flex; 
                justify-content: center; 
                width: 80vw;
                padding: 10px;
                background-color: #fd9d9d70;
                flex-wrap: wrap;
            "></div>
        </div>
    </body>
</html>
<script>
    const MAIN = document.getElementById("main");
    const INPUT = document.getElementById("input");
    const OUTPUT = document.getElementById("output");
    const PLACEHOLDER = "Input some text.";
    const ROOTS = 6;
    // const BINDINGS = [
    //     "A", "B", "C", "D", "E", "F",
    //     "G", "H", "I", "J", "K", "L",
    //     "M", "N", "O", "P", "R", "S",
    //     "T", "U", "V", "W", "X", "Y"
    // ];
    const BINDINGS = [
        "M", "N", "K", "O", "L", "J",
        "S", "H", "E", "I", "F", "D",
        "A", "B", "X", "C", "Y", "W",
        "G", "T", "Z", "U", "R", "P",
    ];
    const CLASSES = ["", "rotate-90", "rotate-180", "rotate-270"];
    let input_length = 0;
    const OUTPUTS = [];

    document.addEventListener("keydown", (event)=>{
        if (event.key === "Backspace") {
            backspaceHandler();
        } else if (event.key === " ") {
            blankspaceHandler();
        } else if (event.ctrlKey) { return; } else {
            console.log(event.key);
            const key = event.key.toUpperCase();
            const index = BINDINGS.indexOf(key);
            if (index !== -1) {
                const i = ~~(index / ROOTS); // euclidian division
                const j = index % ROOTS;
                handleInput(i, j);
            }
        }
    });

    for (let i = 0; i < CLASSES.length; i++) {
        const row = document.createElement("div");
        row.style.display = "flex";
        row.style.justifyContent = "center";

        for (let j = 0; j < ROOTS; j++) {
            row.appendChild(createCharacterDiv(i, j));
        }

        MAIN.appendChild(row);
    }
    if (window.innerWidth <= 768) {
        const btns = {
            "back": backspaceHandler,
            "blank": blankspaceHandler,
            "trash": clearHandler
        };
        const row = document.createElement("div");
        row.style.display = "flex";
        row.style.justifyContent = "center";

        Object.entries(btns).forEach(([k, v])=> {
            const btn = document.createElement("div");
            btn.className = "btn";
            btn.style.display = "flex";
            btn.style.justifyContent = "center";
            btn.style.alignItems = "center";
            btn.style.backgroundColor = "#f4f4f4e5";
            btn.style.borderRadius = "10px";
            const img = document.createElement("img");
            img.src = `assets/${k}.png`;
            img.style.width = "8vw";
            img.style.padding = "1vw";
            btn.appendChild(img);
            
            btn.addEventListener("pointerdown", v);
            row.appendChild(btn);
        });
        MAIN.appendChild(row);
    }

    function computeBinding(i, j) {
        return i * ROOTS + j;
    }
    function createCharacterDiv(i, j) {
        const box = document.createElement("div");
        box.style.display = "flex";
        box.style.flexDirection = "column";
        box.className = "btn-box";
        const BINDING = BINDINGS[computeBinding(i, j)];

        const img = document.createElement("img");
        img.src = `assets/${j+1}.png`;
        img.className = CLASSES[i];
        img.classList.add("btn");
        img.addEventListener("pointerdown", ()=>handleInput(i, j, BINDING));
        box.appendChild(img);
        
        const p = document.createElement("p");
        p.style.fontSize = "20px";
        p.style.padding = "5px";
        p.style.backgroundColor = "#f4f4f4c6";
        p.style.borderRadius = "10px";
        p.style.textAlign = "center";
        p.textContent = BINDING;
        p.style.margin = "0px";
        box.appendChild(p);

        return box;
    }

    function clearHandler() {
        INPUT.textContent = PLACEHOLDER;
        input_length = 0;

        OUTPUTS.forEach((x)=>OUTPUT.removeChild(x));
        OUTPUTS.length = 0;
    }
    function blankspaceHandler() {
        if (input_length === 0) { return; }
        if (INPUT.textContent.charAt(INPUT.textContent.length - 1) === " ") { return; }

        INPUT.textContent = INPUT.textContent + " ";
        input_length++;
        const opt = document.createElement("div");
        opt.style.width = "20px";
        opt.style.height = "20px";
        OUTPUT.appendChild(opt);
        OUTPUTS.push(opt);
    }
    function backspaceHandler() {
        if (input_length === 0) { return; }

        INPUT.textContent = INPUT.textContent.substring(0, INPUT.textContent.length - 1);
        input_length--;
        if (input_length === 0) {
            INPUT.textContent = PLACEHOLDER;
        }

        let opt = OUTPUTS.pop();
        OUTPUT.removeChild(opt);
    }
    function handleInput(i, j, binding) {
        if (binding === undefined) {
            binding = BINDINGS[computeBinding(i, j)];
        }

        if (input_length === 0) {
            INPUT.textContent = binding;
        } else {
            INPUT.textContent = INPUT.textContent + binding;
        }

        input_length++;
        const opt = createOutput(i, j);
        OUTPUT.appendChild(opt);
        OUTPUTS.push(opt);
    }

    function createOutput(i, j) {
        const img = document.createElement("img");
        img.src = `assets/${j+1}.png`;
        img.className = CLASSES[i];
        img.style.width = "20px";

        return img;
    }
</script>
<style>
    body {
        background-image: url(assets/bg.jpg);
        overflow-y: hidden;
    }
    img:hover {
        cursor: pointer;        
    }

    .rotate-90 {
        transform: rotateZ(90deg);
    }

    .rotate-180 {
        transform: rotateZ(180deg);
    }

    .rotate-270 {
        transform: rotateZ(270deg);
    }

    .btn {
        width: 50px;
        margin: 10px;
    }
    .btn-box {
        margin: 10px;
    }

    @media (max-width: 768px) {
        .btn {
            width: 10vw;
        }
        .btn-box {
            margin: 0.5vw;
        }
    }
</style>
